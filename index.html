<script>
document.addEventListener('DOMContentLoaded', () => {
  // === СТИЛИ УВЕДОМЛЕНИЙ ===
  if (!document.getElementById('notification-styles')) {
    const style = document.createElement('style');
    style.id = 'notification-styles';
    style.textContent = `
      @keyframes fadeShow { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
      @keyframes fadeHide { from { opacity: 1; } to { opacity: 0; } }
    `;
    document.head.appendChild(style);
  }

  // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
  let isMarathonSession = false;
  let marathonDay = null;
  let totalMs = null;
  let endTime = null;
  let startTime = null;
  let timerInterval = null;
  let phaseInterval = null;
  let isPaused = false;
  let audioContext = null;
  let currentPhaseIndex = 0;
  let selectedDuration = null;
  let fullChakraCycle = false;
  let chakraCycleInterval = null;
  let phaseStartTime = null;
  const BG_VOLUME = 0.05;
  let hangVolumeLevel = 0.3;
  const phaseDuration = 4000;

  const sectors = [
    document.getElementById('segment1'),
    document.getElementById('segment2'),
    document.getElementById('segment3'),
    document.getElementById('segment4')
  ];

  const hangNotes = [293.7, 349.2, 392.0, 466.2];

  const chakras = [
    { name: "Муладхара", hz: 174, color: "#ff0000" },
    { name: "Свадхистхана", hz: 285, color: "#ff8000" },
    { name: "Манипура", hz: 396, color: "#ffff00" },
    { name: "Анахата", hz: 417, color: "#00ff00" },
    { name: "Вишудха", hz: 528, color: "#00ffff" },
    { name: "Аджна", hz: 639, color: "#0000ff" },
    { name: "Сахасрара", hz: 741, color: "#8000ff" },
    { name: "Космос", hz: 852, color: "#00ffff" },
    { name: "Единство", hz: 963, color: "#ffd700" }
  ];

  const chakraShortDescriptions = {
    174: "Естественное обезболивающее средство. Даёт органам чувство безопасности и любви.",
    285: "Помогает восстанавливать ткани и возвращать их к первоначальному виду.",
    396: "Освобождает от чувства вины и страха, позволяя начать заново.",
    417: "Отменяет прошлые травмы и способствует внутренним изменениям.",
    528: "Частота чуда. Способствует трансформации, ясности ума и восстановлению.",
    639: "Гармонизирует отношения и раскрывает сердечный центр.",
    741: "Решает проблемы, очищает от токсинов и расширяет сознание.",
    852: "Пробуждает интуицию и возвращает к духовному порядку.",
    963: "Связывает с потоком Света и ощущением единства со Всем."
  };

  let currentBackgroundOscillator = null;
  let currentBackgroundGain = null;
  let currentFrequency = 396;

  // === УВЕДОМЛЕНИЕ ===
  function showMessage(text) {
    const el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = `
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.9);
      color: #d0d0f5;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 1rem;
      z-index: 200;
      opacity: 0;
      animation: fadeShow 0.3s forwards, fadeHide 0.3s forwards 2.7s;
    `;
    document.body.appendChild(el);
    setTimeout(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 3000);
  }

  // === НАВИГАЦИЯ ===
  function showScreen(screenId) {
    if (location.hash === '#meditation' && screenId === 'main-screen') {
      stopSessionWithoutSaving();
    }

    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
    
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    if (screenId === 'main-screen') document.getElementById('nav-main').classList.add('active');
    else if (screenId === 'meditation-screen') {
      document.getElementById('nav-meditation').classList.add('active');
      document.getElementById('meditation-volume').value = hangVolumeLevel;
      if (endTime && !isPaused) {
        document.getElementById('session-controls').classList.remove('hidden');
      } else {
        document.getElementById('session-controls').classList.add('hidden');
      }
    }
    else if (screenId === 'marathon-screen') {
      document.getElementById('nav-marathon').classList.add('active');
      updateMarathonScreen();
    }
    else if (screenId === 'help-screen') document.getElementById('nav-help').classList.add('active');
    else if (screenId === 'settings-screen') {
      document.getElementById('nav-settings').classList.add('active');
      renderChakraList();
    }
    
    history.pushState(null, '', `#${screenId.replace('-screen', '')}`);
  }

  // === ОБРАБОТЧИКИ НАВИГАЦИИ ===
  document.getElementById('nav-main').addEventListener('click', () => showScreen('main-screen'));
  document.getElementById('nav-meditation').addEventListener('click', () => showScreen('meditation-screen'));
  document.getElementById('nav-marathon').addEventListener('click', () => showScreen('marathon-screen'));
  document.getElementById('nav-help').addEventListener('click', () => showScreen('help-screen'));
  document.getElementById('nav-settings').addEventListener('click', () => showScreen('settings-screen'));

  document.getElementById('go-meditation-home').addEventListener('click', () => showScreen('meditation-screen'));
  document.getElementById('go-marathon-home').addEventListener('click', () => showScreen('marathon-screen'));

  window.addEventListener('popstate', () => {
    const hash = location.hash.replace('#', '');
    if (hash === 'meditation') showScreen('meditation-screen');
    else if (hash === 'marathon') showScreen('marathon-screen');
    else if (hash === 'help') showScreen('help-screen');
    else if (hash === 'settings') showScreen('settings-screen');
    else showScreen('main-screen');
  });

  // === ГРОМКОСТЬ ===
  function updateVolume(value) {
    hangVolumeLevel = parseFloat(value);
    if (audioContext && currentBackgroundGain) {
      const vol = (Math.pow(hangVolumeLevel / 50, 2) * 0.5 * 0.6) * 0.1;
      currentBackgroundGain.gain.setValueAtTime(vol, audioContext.currentTime);
    }
  }

  document.getElementById('breath-volume').addEventListener('input', (e) => {
    updateVolume(e.target.value);
    document.getElementById('meditation-volume').value = e.target.value;
  });

  document.getElementById('meditation-volume').addEventListener('input', (e) => {
    updateVolume(e.target.value);
    document.getElementById('breath-volume').value = e.target.value;
  });

  // === МАРАФОН ===
  function getMarathonProgress() {
    const data = localStorage.getItem('marathon_progress');
    return data ? JSON.parse(data) : { 
      active: false, 
      days: {}, 
      startDate: null,
      completed: false 
    };
  }

  function startMarathon() {
    const progress = getMarathonProgress();
    if (!progress.active) {
      progress.active = true;
      progress.startDate = new Date().toISOString().split('T')[0];
      localStorage.setItem('marathon_progress', JSON.stringify(progress));
    }
    document.getElementById('marathon-start-section').classList.add('hidden');
    document.getElementById('marathon-days-container').classList.remove('hidden');
    renderMarathonButtons();
  }

  function renderMarathonButtons() {
    const grid = document.getElementById('marathon-days-grid');
    if (!grid) return;
    grid.innerHTML = '';
    
    const progress = getMarathonProgress();
    let nextDay = 1;
    
    if (progress.active) {
      for (let i = 1; i <= 8; i++) {
        if (!progress.days[i]) {
          nextDay = i;
          break;
        }
        if (i === 8) nextDay = 9;
      }
    }

    for (let i = 1; i <= 8; i++) {
      const btn = document.createElement('button');
      btn.className = 'marathon-day-btn';
      btn.dataset.day = i;
      
      if (progress.active && progress.days[i]) {
        btn.classList.add('completed');
        btn.textContent = '🌸';
        btn.disabled = true;
      } else if (i === nextDay && nextDay <= 8) {
        btn.textContent = i;
        btn.disabled = false;
        btn.addEventListener('click', () => startMarathonDay(i));
      } else {
        btn.textContent = i;
        btn.disabled = true;
      }
      
      grid.appendChild(btn);
    }
  }

  function startMarathonDay(day) {
    isMarathonSession = true;
    marathonDay = day;
    showScreen('meditation-screen');
  }

  function completeMarathonDay(day) {
    if (!endTime || Date.now() - startTime < selectedDuration - 1000) return;

    const progress = getMarathonProgress();
    if (!progress.active) {
      progress.active = true;
      progress.startDate = new Date().toISOString().split('T')[0];
    }

    const today = new Date().toISOString().split('T')[0];
    if (progress.days[day] && progress.days[day] === today) return;

    progress.days[day] = today;
    localStorage.setItem('marathon_progress', JSON.stringify(progress));

    showMessage("Вы молодец! Хорошего вам дня!");
    
    setTimeout(() => {
      showScreen('marathon-screen');
      renderMarathonButtons(); // Гарантируем обновление
    }, 2000);
  }

  function updateMarathonScreen() {
    const progress = getMarathonProgress();
    if (progress.active) {
      document.getElementById('marathon-start-section').classList.add('hidden');
      document.getElementById('marathon-days-container').classList.remove('hidden');
    } else {
      document.getElementById('marathon-start-section').classList.remove('hidden');
      document.getElementById('marathon-days-container').classList.add('hidden');
    }
    renderMarathonButtons();
  }

  document.getElementById('start-marathon-btn').addEventListener('click', startMarathon);

  function resetMarathon() {
    localStorage.removeItem('marathon_progress');
    const progress = getMarathonProgress();
    if (!progress.active) {
      document.getElementById('marathon-start-section').classList.remove('hidden');
      document.getElementById('marathon-days-container').classList.add('hidden');
      renderMarathonButtons();
    }
    showMessage("Марафон сброшен.");
  }

  document.getElementById('reset-marathon-btn').addEventListener('click', resetMarathon);

  // === МЕДИТАЦИЯ ===
  function playHangSound(frequency) {
    if (typeof window.AudioContext === 'undefined') return;
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    const now = audioContext.currentTime;
    const duration = 2.5;
    const masterGain = (Math.pow(hangVolumeLevel / 50, 2) * 0.5 * 0.6);
    const partials = [
      { freq: frequency, amp: 1.0, decay: 2.5 },
      { freq: frequency * 1.5, amp: 0.4, decay: 1.8 },
      { freq: frequency * 2.0, amp: 0.25, decay: 1.2 }
    ];
    partials.forEach(p => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();
      osc.type = 'sine';
      osc.frequency.value = p.freq;
      filter.type = 'lowpass';
      filter.frequency.value = p.freq * 3;
      filter.Q.value = 0.5;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(masterGain * p.amp, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + p.decay);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(now);
      osc.stop(now + duration);
    });
  }

  function startBackgroundTone(freq) {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    const now = audioContext.currentTime;

    if (currentBackgroundGain) {
      currentBackgroundGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
      if (currentBackgroundOscillator) {
        currentBackgroundOscillator.stop(now + 1.0);
      }
    }

    const oscillator = audioContext.createOscillator();
    const merger = audioContext.createChannelMerger(2);
    const gainNode = audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(freq, now);

    oscillator.connect(merger, 0, 0);
    oscillator.connect(merger, 0, 1);
    merger.connect(gainNode);
    gainNode.connect(audioContext.destination);

    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(BG_VOLUME * 0.12, now + 1.0);

    oscillator.start(now);

    currentBackgroundOscillator = oscillator;
    currentBackgroundGain = gainNode;
  }

  function stopBackgroundTone() {
    if (currentBackgroundGain) {
      const now = audioContext.currentTime;
      currentBackgroundGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
      if (currentBackgroundOscillator) {
        currentBackgroundOscillator.stop(now + 1.0);
      }
      currentBackgroundOscillator = null;
      currentBackgroundGain = null;
    }
  }

  function animateBreathCircle() {
    if (!phaseStartTime || isPaused) return;

    const now = Date.now();
    const elapsed = now - phaseStartTime;
    const progress = (elapsed % phaseDuration) / phaseDuration;

    sectors.forEach(s => {
      s.classList.remove('active');
      s.style.background = '';
    });

    const currentSector = sectors[currentPhaseIndex];
    currentSector.classList.add('active');

    const baseHue = 200 + 240 * (currentPhaseIndex / 4);
    const hue = baseHue + 30 * Math.sin(progress * Math.PI);
    const lightness = 45 + 25 * Math.sin(progress * Math.PI);
    const saturation = 80 + 20 * Math.sin(progress * Math.PI);
    currentSector.style.background = `linear-gradient(135deg, hsl(${hue}, ${saturation}%, ${lightness}%), hsl(${hue - 30}, ${saturation}%, ${lightness - 10}%))`;

    requestAnimationFrame(animateBreathCircle);
  }

  function startSession(durationMs) {
    stopSession();
    sectors.forEach(s => {
      s.classList.remove('active');
      s.style.background = '';
    });

    totalMs = durationMs;
    startTime = Date.now();
    endTime = startTime + totalMs;
    isPaused = false;
    currentPhaseIndex = 0;
    phaseStartTime = Date.now();
    selectedDuration = durationMs;

    playHangSound(hangNotes[currentPhaseIndex]);
    
    if (fullChakraCycle) {
      startChakraCycle(totalMs);
    } else {
      startBackgroundTone(currentFrequency);
    }

    phaseInterval = setInterval(() => {
      if (isPaused) return;
      currentPhaseIndex = (currentPhaseIndex + 1) % 4;
      playHangSound(hangNotes[currentPhaseIndex]);
    }, phaseDuration);

    animateBreathCircle();

    timerInterval = setInterval(updateTimer, 250);
    updateTimer();

    document.getElementById('pause-btn').textContent = '⏸ Пауза';
  }

  function pauseResumeSession() {
    if (!endTime) return;
    if (isPaused) {
      startTime = Date.now() - (totalMs - (endTime - Date.now()));
      endTime = startTime + totalMs;
      isPaused = false;
      phaseStartTime = Date.now() - (Date.now() - startTime) % phaseDuration;
      if (fullChakraCycle) {
        startChakraCycle(totalMs);
      } else {
        startBackgroundTone(currentFrequency);
      }
      animateBreathCircle();
      document.getElementById('pause-btn').textContent = '⏸ Пауза';
    } else {
      isPaused = true;
      stopBackgroundTone();
      stopChakraCycle();
      document.getElementById('pause-btn').textContent = '▶ Возобновить';
    }
  }

  function stopSession() {
    if (timerInterval) clearInterval(timerInterval);
    if (phaseInterval) clearInterval(phaseInterval);
    timerInterval = null;
    phaseInterval = null;
    phaseStartTime = null;
    endTime = null;
    isPaused = false;
    stopBackgroundTone();
    stopChakraCycle();
    
    if (location.hash === '#meditation' && selectedDuration) {
      if (isMarathonSession && marathonDay) {
        completeMarathonDay(marathonDay);
        isMarathonSession = false;
        marathonDay = null;
      } else {
        // Обычная медитация — возвращаем выбор времени
        document.getElementById('duration-controls').classList.remove('hidden');
        document.getElementById('play-btn').classList.add('hidden');
        document.getElementById('session-controls').classList.add('hidden');
      }
    }

    resetToStart();
  }

  function stopSessionWithoutSaving() {
    if (timerInterval) clearInterval(timerInterval);
    if (phaseInterval) clearInterval(phaseInterval);
    timerInterval = null;
    phaseInterval = null;
    phaseStartTime = null;
    endTime = null;
    isPaused = false;
    stopBackgroundTone();
    stopChakraCycle();
  }

  function startChakraCycle(totalMs) {
    if (!fullChakraCycle) return;
    stopChakraCycle();
    const sequence = [0,1,2,3,4,5,6,7,8,7,6,5,4,3,2,1];
    const stepMs = totalMs / sequence.length;
    let stepIndex = 0;
    currentFrequency = chakras[sequence[stepIndex]].hz;
    startBackgroundTone(currentFrequency);
    chakraCycleInterval = setInterval(() => {
      if (isPaused) return;
      stepIndex = (stepIndex + 1) % sequence.length;
      currentFrequency = chakras[sequence[stepIndex]].hz;
      startBackgroundTone(currentFrequency);
    }, stepMs);
  }

  function stopChakraCycle() {
    if (chakraCycleInterval) {
      clearInterval(chakraCycleInterval);
      chakraCycleInterval = null;
    }
  }

  // === ЧАКРЫ ===
  const fullChakraCheckbox = document.getElementById('full-chakra-cycle');

  fullChakraCheckbox.addEventListener('change', () => {
    fullChakraCycle = fullChakraCheckbox.checked;
    if (fullChakraCycle) {
      document.querySelectorAll('.chakra-circle').forEach(c => c.classList.remove('active'));
    }
    if (endTime && !isPaused) {
      stopChakraCycle();
      stopBackgroundTone();
      if (fullChakraCycle) {
        startChakraCycle(totalMs);
      } else {
        startBackgroundTone(currentFrequency);
      }
    }
  });

  function renderChakraList() {
    const chakraList = document.getElementById('chakra-list');
    chakraList.innerHTML = '';
    
    chakras.forEach((chakra, index) => {
      const row = document.createElement('div');
      row.className = 'chakra-row';

      const textDiv = document.createElement('div');
      textDiv.className = 'chakra-text';
      textDiv.innerHTML = `
        <div class="chakra-name">${chakra.name}</div>
        <div class="chakra-hz">${chakra.hz} Гц</div>
        <div class="chakra-desc">${chakraShortDescriptions[chakra.hz]}</div>
      `;

      const circle = document.createElement('div');
      circle.className = 'chakra-circle';
      circle.dataset.hz = chakra.hz;
      circle.style.backgroundColor = chakra.color;
      if (chakra.hz === currentFrequency) circle.classList.add('active');

      circle.addEventListener('click', () => {
        if (fullChakraCheckbox.checked) {
          showMessage("Отключите «Полный цикл», чтобы выбрать частоту");
          return;
        }
        document.querySelectorAll('.chakra-circle').forEach(c => c.classList.remove('active'));
        circle.classList.add('active');
        currentFrequency = chakra.hz;
        if (!isPaused && endTime) {
          startBackgroundTone(currentFrequency);
        }
      });

      row.appendChild(textDiv);
      row.appendChild(circle);
      chakraList.appendChild(row);
    });
  }

  function resetToStart() {
    stopSession();
    document.getElementById('timer').textContent = '00:00';
    document.querySelectorAll('#duration-controls button').forEach(b => b.classList.remove('active'));
    selectedDuration = null;
  }

  const durationControls = document.getElementById('duration-controls');
  const playBtn = document.getElementById('play-btn');
  const sessionControls = document.getElementById('session-controls');

  document.querySelectorAll('#duration-controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#duration-controls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedDuration = parseInt(btn.dataset.mins) * 60 * 1000;
      playBtn.classList.remove('hidden');
      playBtn.style.display = 'inline-block';
    });
  });

  function updateTimer() {
    if (isPaused) return;
    const now = Date.now();
    let remaining = endTime - now;
    if (remaining <= 0) {
      remaining = 0;
      stopSession();
      showMessage("Практика завершена. Спасибо за заботу о себе.");
      setTimeout(resetToStart, 3000);
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    document.getElementById('timer').textContent = 
      `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  playBtn.addEventListener('click', () => {
    if (selectedDuration) {
      startSession(selectedDuration);
      durationControls.classList.add('hidden');
      playBtn.classList.add('hidden');
      sessionControls.classList.remove('hidden');
    }
  });

  document.getElementById('pause-btn').addEventListener('click', pauseResumeSession);
  document.getElementById('stop-btn').addEventListener('click', resetToStart);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      showScreen('main-screen');
    }
  });

  renderChakraList();
  const initialHash = location.hash.replace('#', '');
  if (initialHash === 'meditation') showScreen('meditation-screen');
  else if (initialHash === 'marathon') showScreen('marathon-screen');
  else if (initialHash === 'help') showScreen('help-screen');
  else if (initialHash === 'settings') showScreen('settings-screen');
  else showScreen('main-screen');
});
</script>
